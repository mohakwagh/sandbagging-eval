version: "3.9"

services:
  pipeline:
    build: .
    env_file:
      - .env
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    command: ["python", "-m", "pipeline.run", "--config", "config.yaml"]

  dataset-builder:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "dataset_builder.build", "--config", "config.yaml"]
