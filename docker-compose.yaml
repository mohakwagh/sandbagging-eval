services:
  dataset-builder:
    build: .
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    command: ["python", "-m", "dataset_builder.build", "--config", "config.yaml"]
    restart: "no"

  pipeline:
    build: .
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data:ro
      - ./results:/app/results
    command: ["python", "-m", "pipeline.run", "--config", "config.yaml"]
    restart: "no"
